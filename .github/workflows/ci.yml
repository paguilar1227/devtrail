# .github/workflows/ci.yml
#
# CI on every PR + push to main. Today this runs:
#   - Backend type check
#   - Backend unit + integration tests (mocked DB, mocked providers)
#   - Frontend build
#   - Frontend e2e (Playwright against vite dev server, mock data)
#
# No Postgres, Azurite, or upstream LLM keys required — every test layer is
# self-contained. When we add an integration test that needs real Postgres or
# Blob, add them as service containers below. Pattern:
#
#   services:
#     postgres:
#       image: pgvector/pgvector:pg16
#       env:
#         POSTGRES_USER: openbrain
#         POSTGRES_PASSWORD: openbrain
#         POSTGRES_DB: openbrain
#       ports: ['5434:5432']
#       options: --health-cmd "pg_isready -U openbrain" --health-interval 2s --health-timeout 5s --health-retries 15
#     azurite:
#       image: mcr.microsoft.com/azure-storage/azurite:latest
#       ports: ['10010:10000']
#
# That gives CI parity with `docker compose up` locally. Until we have a test
# that needs them, leaving them out keeps CI fast (<3 min today).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Type check backend
        working-directory: backend
        run: npx tsc --noEmit
      - name: Unit + integration tests
        working-directory: backend
        run: npm test
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Type check + build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Playwright browsers
        working-directory: frontend
        run: npm run test:e2e:install
      - name: Run frontend e2e tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
