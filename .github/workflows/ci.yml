# .github/workflows/ci.yml
#
# Cloud CI runs the SAME pipeline as local: `make ci-full` (type-check + unit +
# build + full-stack Playwright e2e against real Postgres + Azurite + a
# stub-mode backend). The Makefile is the single source of truth, so a green
# `make ci-full` locally means a green run here — no drift between the two.
#
# CI MODEL (see CLAUDE.md "CI model"): iterate locally behind the lefthook
# pre-push gate (`make ci`). Cloud CI runs ONLY at merge / post-merge:
#   - push: main         post-merge safety net (runs once per merge, not push)
#   - workflow_dispatch  run the full suite on a branch before merging
# There is intentionally no per-PR-push trigger — that's what local CI is for,
# and it's what keeps the free-tier Actions minutes from burning during a PR.

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Workspaces (shared, backend, frontend) all install from the root.
      - name: Install workspace deps
        run: npm ci

      # Identical to `make ci-full` locally: build @open-brain/shared, backend
      # type-check, backend + frontend unit tests, frontend build, then the
      # full-stack e2e. The e2e target brings up docker compose (Postgres +
      # Azurite), copies stub-mode .env files, installs Playwright browsers,
      # starts the backend + Vite, and seeds — all self-contained.
      - name: make ci-full
        run: make ci-full

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
