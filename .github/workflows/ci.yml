# .github/workflows/ci.yml
#
# CI on every PR + push to main. Runs:
#   - Backend type check
#   - Backend unit + integration tests (mocked DB, mocked providers)
#   - Frontend build (TypeScript + Vite)
#   - Full-stack workflow e2e (Playwright against real Postgres + Azurite +
#     stub-mode backend + Vite dev server, seeded with seed-local.ts).
#
# The e2e suite mirrors `npm run dev:up` locally, so a green CI run is strong
# evidence that a fresh clone + dev:up will work. Stub-mode LLM providers
# keep the run fast and free — no upstream API keys needed.

name: CI

on:
  # Auto-triggers temporarily disabled to conserve free-tier Actions
  # minutes. Deploys are happening manually via scripts/deploy.sh against
  # Azure for now. To re-enable: restore the blocks below.
  #   pull_request:
  #     branches: [main]
  #   push:
  #     branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Workspaces (shared, backend, frontend) all install from the root.
      - name: Install workspace deps
        run: npm ci

      # @open-brain/shared exports compiled JS (dist/) — backend's tsc and
      # vitest both resolve through the workspace symlink, so dist must
      # exist before any of them run.
      - name: Build @open-brain/shared
        run: npm run build --workspace=@open-brain/shared

      - name: Type check backend
        working-directory: backend
        run: npx tsc --noEmit

      - name: Backend unit + integration tests
        working-directory: backend
        run: npm test

      - name: Type check + build frontend
        working-directory: frontend
        run: npm run build

      # ---- Full-stack e2e ----
      # Playwright's globalSetup expects docker compose; the runner has it
      # pre-installed. Stub-mode .env files ship with the repo's .env.example
      # files, so we just copy them into place.
      - name: Prepare stub-mode env files
        run: |
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env.local

      - name: Bring up Postgres + Azurite via docker compose
        run: docker compose up -d --wait

      - name: Install Playwright browsers
        working-directory: frontend
        run: npm run test:e2e:install

      - name: Run full-stack workflow e2e
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Tear down docker compose
        if: always()
        run: docker compose down -v
