# .github/workflows/deploy.yml
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      app_url: ${{ steps.app_url.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push Docker image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/open-brain-v2:${IMAGE_TAG} .
          docker tag ${{ env.ACR_NAME }}.azurecr.io/open-brain-v2:${IMAGE_TAG} ${{ env.ACR_NAME }}.azurecr.io/open-brain-v2:latest
          docker push ${{ env.ACR_NAME }}.azurecr.io/open-brain-v2:${IMAGE_TAG}
          docker push ${{ env.ACR_NAME }}.azurecr.io/open-brain-v2:latest

      - name: Deploy Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/open-brain-v2:${{ github.sha }}

      - name: Resolve Container App URL
        id: app_url
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "url=https://${FQDN}" >> "$GITHUB_OUTPUT"

      - name: Wait for /health to return 200
        run: |
          for i in {1..30}; do
            if curl -fsS "${{ steps.app_url.outputs.url }}/health" >/dev/null; then
              echo "healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after 150s"; exit 1

  # ---------------------------------------------------------------------------
  # Post-deploy smoke
  #
  # Runs on every push to main, only after build-and-deploy succeeds. Its job
  # is to prove the deployed container is alive and the auth boundaries are
  # correctly wired — nothing more.
  #
  # COST INVARIANT — DO NOT VIOLATE:
  #   Every endpoint hit here MUST be free (no LLM, no embedding, no external
  #   API spend, no blob upload). Today that means:
  #     - /health                       (constant response)
  #     - /api/v1/projects (no key)     (rejected at middleware)
  #     - /api/v1/projects (with key)   (Postgres SELECT only)
  #     - /mcp initialize               (returns server capabilities)
  #     - / as a browser                (Easy Auth redirect)
  #
  #   DO NOT add: /rag, /search, POST /content (any file/url), /find-mentions,
  #   or any path that triggers ingest, embeddings, or LLM completions. Those
  #   cost real money per call and smoke runs once per merge.
  #
  #   The write smoke below (create + hard-delete a project) is allowed
  #   because projects don't trigger any LLM/embedding work — it's two SQL
  #   statements that exercise the write path end-to-end without spend.
  #
  #   Coverage for those expensive paths lives in:
  #     - CI integration tests (mocked providers, every PR, free)
  #     - Local stack with LLM_PROVIDER=stub
  #     - A separate manually-triggered quality validation suite
  # ---------------------------------------------------------------------------
  smoke:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Smoke — health (public)
        run: |
          curl -fsS "${{ needs.build-and-deploy.outputs.app_url }}/health" | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json

      - name: Smoke — REST API auth gate (no key → 401)
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            "${{ needs.build-and-deploy.outputs.app_url }}/api/v1/projects")
          echo "no-key code=$CODE"
          test "$CODE" = "401"

      - name: Smoke — REST API with key → 200
        env:
          KEY: ${{ secrets.OPEN_BRAIN_API_KEY }}
        run: |
          curl -fsS \
            -H "Authorization: Bearer $KEY" \
            "${{ needs.build-and-deploy.outputs.app_url }}/api/v1/projects" \
            | jq -e '.projects | type == "array"'

      - name: Smoke — MCP initialize → 200 with serverInfo
        env:
          KEY: ${{ secrets.OPEN_BRAIN_API_KEY }}
        run: |
          curl -fsS \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -H "Authorization: Bearer $KEY" \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"deploy-smoke","version":"1"}}}' \
            "${{ needs.build-and-deploy.outputs.app_url }}/mcp" \
            | jq -e '.result.serverInfo.name == "open-brain"'

      - name: Smoke — UI is auth-gated (browser request → 302 to login)
        run: |
          REDIRECT=$(curl -s -o /dev/null -w '%{redirect_url}' \
            -H 'Accept: text/html' \
            -H 'User-Agent: Mozilla/5.0' \
            "${{ needs.build-and-deploy.outputs.app_url }}/")
          echo "ui redirect=$REDIRECT"
          echo "$REDIRECT" | grep -q 'login.microsoftonline.com'

      # Round-trip a transient project: POST → GET (list contains it) →
      # DELETE hard → GET (list does not contain it). Validates that the
      # write path, query path, and delete path are all wired against the
      # live database in production.
      - name: Smoke — create / verify / delete a transient project
        env:
          KEY: ${{ secrets.OPEN_BRAIN_API_KEY }}
          APP_URL: ${{ needs.build-and-deploy.outputs.app_url }}
        run: |
          set -euo pipefail
          NAME="__smoke__-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "creating project: $NAME"

          ID=$(curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $KEY" \
            -d "{\"name\":\"$NAME\",\"description\":\"deploy smoke — safe to delete\"}" \
            "$APP_URL/api/v1/projects" | jq -r '.project.id')
          echo "created id=$ID"
          [ -n "$ID" ] && [ "$ID" != "null" ]

          echo "verifying project appears in list"
          curl -fsS \
            -H "Authorization: Bearer $KEY" \
            "$APP_URL/api/v1/projects" \
            | jq -e --arg id "$ID" '.projects | map(.id) | index($id) != null'

          echo "hard-deleting project"
          curl -fsS -X DELETE \
            -H "Authorization: Bearer $KEY" \
            "$APP_URL/api/v1/projects/$ID?hard=true" \
            | jq -e '.ok == true'

          echo "verifying project no longer in list"
          curl -fsS \
            -H "Authorization: Bearer $KEY" \
            "$APP_URL/api/v1/projects" \
            | jq -e --arg id "$ID" '.projects | map(.id) | index($id) == null'
