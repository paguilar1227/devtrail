<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2062 413" width="2062" height="413" role="img" aria-label="An agent's handoff reaches a person" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif">
<title>An agent's handoff reaches a person</title>
<desc>DevTrail is one server that people and AI agents share. People use the web and iOS app; agents use the MCP server; scripts use the REST API. All three call the same services, so a todo, note, document or session handoff written by an agent is the same record a person reads. Postgres triggers record every change into a durable timeline, and everything saved is chunked, embedded and linked into an entity graph so hybrid search and cited answers can find it.</desc>
